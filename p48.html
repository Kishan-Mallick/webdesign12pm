<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100vw;
            height: 50vh;
            margin: 0px auto;
            border: 3px solid red;
        }
        .container{
            width: 50%;
            
            margin: 0px auto;
            border: 3px solid rgb(17, 0, 255);
        }

        .heading{
            color: green;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="container" id="container1">
            <h1>I am a heading 1</h1>
        </div>
    </div>

    <script>
        var heading2 = document.createElement('h1');
        heading2.innerHTML = 'I am a heading 2 append';
        heading2.className = 'heading';

        console.log(heading2);

        var con = document.getElementById('container1');

        console.log(con)
        con.append(heading2);

        var heading3 = document.createElement('h1');
        heading3.innerHTML = 'I am a heading 3 prepend';
        heading3.className = 'heading';

        con.prepend(heading3);

        var heading4 = document.createElement('h1');
        heading4.innerHTML = 'I am a heading 4 after';
        heading4.className = 'heading';

        con.after(heading4);

        var heading5 = document.createElement('h1');
        heading5.innerHTML = 'I am a heading 5 before';
        heading5.className = 'heading';

        con.before(heading5);



    </script>
</body>
</html>
